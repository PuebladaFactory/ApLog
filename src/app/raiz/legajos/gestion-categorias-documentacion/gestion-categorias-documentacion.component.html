<div class="modal-content">
  <div class="modal-header">
    <h1>Categorías de Documentación</h1>
    <button type="button" class="btn-close btn" id="cerrar" (click)="activeModal.close()"></button>
  </div>
  <div class="modal-body">

    <div class="d-flex align-items-start mb-3" *appPermiso="'legajos.editar'">
      <input
        class="form-control me-2"
        type="text"
        [(ngModel)]="nombreNuevaCategoria"
        placeholder="Nueva categoría..."
        (keydown.enter)="agregarCategoria()"
      >
      <app-btn-agregar name="Agregar" (click)="agregarCategoria()"></app-btn-agregar>
    </div>

    <table class="table table-striped table-bordered">
      <thead>
        <tr>
          <th style="width:60%">Nombre</th>
          <th style="width:20%" class="text-center">Orden</th>
          <th style="width:20%" class="text-center">Activa</th>
        </tr>
      </thead>
      <tbody>
        @for (categoria of categorias; track categoria.idCategoria; let first = $first; let last = $last) {
          <tr [class.categoria-inactiva]="!categoria.activa">
            <td>
              @if (puedeEditar) {
                <input
                  class="form-control"
                  type="text"
                  [value]="categoria.nombre"
                  (blur)="onBlurNombre(categoria, $any($event.target).value)"
                >
              } @else {
                <span>{{ categoria.nombre }}</span>
              }
            </td>
            <td class="text-center">
              <button
                type="button"
                class="btn btn-sm btn-outline-secondary me-1"
                [disabled]="!puedeEditar || first || !categoria.activa"
                (click)="moverArriba(categoria)"
              >↑</button>
              <button
                type="button"
                class="btn btn-sm btn-outline-secondary"
                [disabled]="!puedeEditar || last || !categoria.activa"
                (click)="moverAbajo(categoria)"
              >↓</button>
            </td>
            <td class="text-center">
              <div class="form-check form-switch d-inline-block">
                <input
                  class="form-check-input"
                  type="checkbox"
                  role="switch"
                  [checked]="categoria.activa"
                  [disabled]="!puedeEditar"
                  (click)="toggleActiva(categoria)"
                >
              </div>
            </td>
          </tr>
        }
      </tbody>
    </table>

  </div>
</div>
