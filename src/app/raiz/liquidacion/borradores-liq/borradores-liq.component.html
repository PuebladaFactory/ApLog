<div class="row g-3 mt-2 mb-3">
  <div class="col-md-3">
    <select class="form-select" [ngModel]="filtroTipo" (ngModelChange)="filtroTipo = $event; aplicarFiltros()">
      <option value="todos">Todos</option>
      <option value="cliente">Clientes</option>
      <option value="chofer">Choferes</option>
      <option value="proveedor">Proveedores</option>
    </select>
  </div>
  <div class="col-md-4">
    <input
      class="form-control"
      type="text"
      [ngModel]="searchText"
      (ngModelChange)="searchText = $event; aplicarFiltros()"
      placeholder="Buscar por razón social"
    />
  </div>
</div>

<app-tabla-listado
  [items]="filtrados"
  [columnas]="columnas"
  [acciones]="acciones"
  [ordenInicial]="ordenInicial"
  [cargando]="cargando"
  [bloqueada]="procesando"
  mensajeVacio="No hay borradores."
  (accion)="onAccion($event)"
></app-tabla-listado>

@if (procesando) {
  <app-spinner></app-spinner>
}
