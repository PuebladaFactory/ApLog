<h2 class="mt-3">Resumen General de Operaciones</h2>
<app-filtro-periodo (periodoChange)="onPeriodoChange($event)"></app-filtro-periodo>

@if (errorPeriodo) {
    <div class="alert alert-danger mt-2">{{ errorPeriodo }}</div>
} @else {
    @if (datos$ | async; as datos) {
        <app-tabla-resumen
            [filas]="datos.filas"
            [total]="datos.total"
            [tipo]="'general'"
            [tituloPeriodo]="tituloPeriodo"
            [razonSocial]="'General'"
        >
        </app-tabla-resumen>
    } @else {
        <app-spinner></app-spinner>
    }
}
