<h2 class="mt-3">Resumen de Op por Entidad</h2>
<div class="card p-3">
    <div class="row g-2 d-flex justify-content-start">
        <div class="col-auto">
            <select
                class="form-select w-auto"
                [ngModel]="tipoEntidad"
                (ngModelChange)="onTipoEntidadChange($event)"
            >
                <option value="cliente">Cliente</option>
                <option value="chofer">Chofer</option>
                <option value="proveedor">Proveedor</option>
            </select>
        </div>
        <div class="col-4">
            <select
                class="form-select"
                [ngModel]="entidadSeleccionada"
                (ngModelChange)="onEntidadChange($event)"
            >
                <option [ngValue]="undefined">Seleccionar...</option>
                @for (e of (entidades$ | async) ?? []; track e.id) {
                    <option [ngValue]="e.id">{{ e.nombre }}</option>
                }
            </select>
        </div>
    </div>
</div>

@if (entidadSeleccionada) {
    <div class="d-flex justify-content-between">
        <div class="d-flex">
            <app-filtro-periodo (periodoChange)="onPeriodoChange($event)" class="align-self-end mb-2">
            </app-filtro-periodo>
        </div>
        <div>
            <h2 class="mt-3 ms-2 mb-2">
                <span class="badge bg-primary-subtle text-primary-emphasis">{{ razonSocial }}</span>
            </h2>
        </div>
    </div>

    @if (errorPeriodo) {
        <div class="alert alert-danger">{{ errorPeriodo }}</div>
    } @else if (datos$) {
        @if (datos$ | async; as datos) {
            <app-tabla-resumen
                [filas]="datos.filas"
                [total]="datos.total"
                [tituloPeriodo]="tituloPeriodo"
                [razonSocial]="razonSocial"
                [tipo]="'entidad'"
                [tipoEntidad]="tipoEntidad"
            >
            </app-tabla-resumen>
        } @else {
            <app-spinner></app-spinner>
        }
    }
}
