<div class="row g-3 mt-2 mb-3 align-items-end">
  <div class="col-md-2">
    <label class="form-label mb-0">Período desde</label>
    <input class="form-control" type="month" [(ngModel)]="desde" />
  </div>
  <div class="col-md-2">
    <label class="form-label mb-0">Período hasta</label>
    <input class="form-control" type="month" [(ngModel)]="hasta" />
  </div>
  <div class="col-md-1">
    <button type="button" class="btn btn-primary w-100" [disabled]="cargando || procesando" (click)="consultar()">Consultar</button>
  </div>
  <div class="col-md-2">
    <select class="form-select" [ngModel]="filtroTipo" (ngModelChange)="filtroTipo = $event; aplicarFiltros()">
      <option value="todos">Todos</option>
      <option value="cliente">Clientes</option>
      <option value="chofer">Choferes</option>
      <option value="proveedor">Proveedores</option>
    </select>
  </div>
  <div class="col-md-3">
    <input
      class="form-control"
      type="text"
      [ngModel]="searchText"
      (ngModelChange)="searchText = $event; aplicarFiltros()"
      placeholder="Buscar por razón social, N° de informe o de factura"
    />
  </div>
  <div class="col-md-2 text-end text-muted">
    {{ filtrados.length }} informe(s) facturado(s)
  </div>
</div>

<app-tabla-listado
  [items]="filtrados"
  [columnas]="columnas"
  [acciones]="acciones"
  [ordenInicial]="ordenInicial"
  [cargando]="cargando"
  [bloqueada]="procesando"
  mensajeVacio="No hay liquidaciones facturadas en el período consultado."
  (accion)="onAccion($event)"
></app-tabla-listado>

@if (procesando) {
  <app-spinner></app-spinner>
}
