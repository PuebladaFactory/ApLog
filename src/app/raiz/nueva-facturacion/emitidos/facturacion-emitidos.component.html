<div class="row g-3 mt-2 mb-3 align-items-center">
  <div class="col-md-3">
    <select class="form-select" [ngModel]="filtroTipo" (ngModelChange)="filtroTipo = $event; aplicarFiltros()">
      <option value="todos">Todos</option>
      <option value="cliente">Clientes</option>
      <option value="chofer">Choferes</option>
      <option value="proveedor">Proveedores</option>
    </select>
  </div>
  <div class="col-md-4">
    <input
      class="form-control"
      type="text"
      [ngModel]="searchText"
      (ngModelChange)="searchText = $event; aplicarFiltros()"
      placeholder="Buscar por razón social o N° de informe"
    />
  </div>
  <div class="col-md-5 text-end text-muted">
    {{ filtrados.length }} informe(s) pendiente(s) de facturar
  </div>
</div>

<app-tabla-listado
  [items]="filtrados"
  [columnas]="columnas"
  [acciones]="acciones"
  [ordenInicial]="ordenInicial"
  [cargando]="cargando"
  mensajeVacio="No hay informes emitidos pendientes de facturar."
  (accion)="onAccion($event)"
></app-tabla-listado>
