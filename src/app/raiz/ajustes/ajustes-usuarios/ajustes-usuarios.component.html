
<div class="mt-3">
  <h2>Listado de Usuarios</h2>
</div>
<div class="">
  <input class="form-control" type="text" [(ngModel)]="searchText" placeholder="Buscar por usuario">
  <table class="table table-striped table-bordered">
    <thead>
      <tr>
        <th scope="col" class="">Usuario</th>
        <th scope="col" class="">Verificado</th>
        <th scope="col" class="">Nombre</th>
        <th scope="col" class="">Rol</th>
        <th scope="col" colspan="2" style="width:7%;"></th>
      </tr>
    </thead>
    <tbody>
      @for (u of $usuariosTodos | filterBy: searchText; track u) {
        <tr>
          <td>{{u.email}}</td>
          <td>{{u.emailVerified}}</td>
          <td>{{u.name}}</td>
          <td>{{u.role === 'admin' ? "Administrador" : u.role === 'manager' ? "Manager" : u.role === 'user' ? "Usuario" : "Sin rol asignado"}}</td>
          <td [ngClass]="{'isDisabled': usuarioSesion.esRol('manager') || usuarioSesion.esRol('user') || (usuarioSesion.esRol('admin') && u.role === 'admin' && usuarioSesion.getUsuarioActual()?.uid !== u.uid) }">
            <app-btn-editar name="Editar" class="mx-2" (click)="openModal(u)" [ngClass]="{'isDisabled':usuarioSesion.esRol('demo')}"></app-btn-editar>
          </td>
          <td [ngClass]="{'isDisabled': usuarioSesion.esRol('manager') || usuarioSesion.esRol('user') || u.role === 'admin' }">
            <app-btn-eliminar name="Eliminar" class="me-2" (click)="eliminarUsuario(u)" [ngClass]="{'isDisabled':usuarioSesion.esRol('demo')}"></app-btn-eliminar>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
