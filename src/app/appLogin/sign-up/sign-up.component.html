

<div class="container">
<app-login-header></app-login-header>

<div class="displayTable">
    <div class="displayTableCell">
      <br/><br>
      <div class="authBlock">
        <h2>Registrarse</h2>
  
        <div class="formGroup">
          <i class="fa fa-user"></i>
          <input
            type="email"
            class="formControl"
            placeholder="Email Address"
            #userEmail
            required
          />
        </div>
  
        <div class="formGroup">
          <i class="fa fa-lock">

          </i><input
            type="password"
            class="formControl"
            placeholder="Password"
            #userPwd
            required
          />
        </div>
  
        <div class="formGroup">
          <input
            type="button"
            class="btn btnPrimary"
            value="Sign Up"
            (click)="authService.registrarUsuario(userEmail.value, userPwd.value)"
          />
        </div>
      </div>
    
      <div class="redirectToLogin">
        <span
          >Tenes una cuenta?
          <span class="redirect" routerLink="/login">
            &nbsp;Log In</span></span>
          <br/><br/>
        </div>
    </div>
  </div>
</div>
