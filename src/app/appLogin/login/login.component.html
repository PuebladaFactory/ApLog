@if (!spinner) {
    <div class="container d-flex justify-content-center mt-2">
        <div class="caja">
            <app-login-header></app-login-header>
            <div class="displayTable w-100 mt-3">
                <div class="displayTableCell">
                    <br /><br />
                    <div class="authBlock">
                        <!-- Eje de sesión, bloque 3: el contenido de la tarjeta depende de la
                             sesión YA reconciliada. Mientras resuelve, un spinner en el lugar
                             del formulario; con sesión viva, se ofrece continuar o cerrarla. -->
                        @if (resolviendo) {
                            <div class="text-center py-4">
                                <div class="spinner-border" role="status">
                                    <span class="visually-hidden">Cargando…</span>
                                </div>
                            </div>
                        } @else if (sesionViva) {
                            <p class="text-center mb-4">
                                Hay una sesión abierta como <strong>{{ sesionViva.email }}</strong>
                            </p>
                            <div class="formGroup">
                                <input type="button" class="btn btnPrimary" value="Continuar" (click)="continuar()" />
                            </div>
                            <div class="formGroup">
                                <input type="button" class="btn btn-outline-secondary w-100" value="Cerrar sesión" (click)="cerrarSesion()" />
                            </div>
                        } @else {
                            <h2>Iniciar Sesión</h2>
                            <!-- <div class="formGroup">
                <i class="fa fa-user"></i>
                <input  type="icon-username" type="text" class="formControl" placeholder="Username" #userName required>
              </div>
              <div class="formGroup">
                <i class="fa fa-lock"></i>
                <input type="password" class="formControl" placeholder="Password" #userPassword required>
              </div> -->
                            <div class="formGroup">
                                <i class="fa fa-user"></i>
                                <input
                                    type="text"
                                    class="formControl"
                                    placeholder="Username"
                                    #userName
                                    required
                                />
                            </div>
                            <div class="formGroup">
                                <i class="fa fa-lock"></i>
                                <input
                                    type="password"
                                    class="formControl"
                                    placeholder="Password"
                                    #userPassword
                                    (keydown)="
                                        onKeydown(
                                            $event,
                                            userName.value,
                                            userPassword.value
                                        )
                                    "
                                    required
                                />
                            </div>
                            <!-- Calling SignIn Api from AuthService -->
                            <div class="formGroup">
                                <input
                                    type="button"
                                    class="btn btnPrimary"
                                    value="Log in"
                                    (click)="
                                        authService.iniciarSesion(
                                            userName.value,
                                            userPassword.value
                                        )
                                    "
                                />
                            </div>
                            <div class="forgotPassword">
                                <span routerLink="/forgot-password"
                                    >Olvide mi contraseña</span
                                >
                            </div>
                        }
                    </div>
                    <br /><br />
                </div>
            </div>
        </div>
    </div>
} @else {}
